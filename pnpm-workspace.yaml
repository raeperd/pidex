packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false

catalog:
  "@types/node": 24.12.4
  "@sveltejs/vite-plugin-svelte": 7.2.0
  svelte: 5.56.7
  svelte-check: 4.7.3
  typescript: 6.0.3
  vite: 8.1.5
