on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm effect:check
      - run: pnpm deadcode
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  package-desktop:
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm package:desktop
