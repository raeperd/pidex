name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and contract tests
        run: pnpm test
      - name: Check formatting, lint, and types
        run: pnpm check
      - name: Check dead code
        run: pnpm deadcode
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e

  package-desktop:
    name: Package desktop
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned macOS app
        run: pnpm package:desktop
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - name: Smoke packaged macOS app
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find apps/desktop/release -maxdepth 2 -type d -name pidex.app -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged pidex.app was not found." >&2
            exit 1
          fi

          test -f "$app_path/Contents/Resources/app.asar"
          test -f "$app_path/Contents/Resources/server/dist/main.js"
          test -e "$app_path/Contents/Resources/server/node_modules/@effect/platform-node"
          test -f "$app_path/Contents/Resources/web/dist/index.html"
          codesign --verify --deep --strict "$app_path"

          smoke_directory="$(mktemp -d)"
          smoke_port=54831
          app_log="$smoke_directory/app.log"
          response_file="$smoke_directory/response.html"
          app_pid=""

          cleanup() {
            if [[ -n "$app_pid" ]]; then
              kill "$app_pid" >/dev/null 2>&1 || true
              wait "$app_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          PIDEX_STATE_DIR="$smoke_directory/state" PORT="$smoke_port" \
            "$app_path/Contents/MacOS/pidex" --disable-gpu \
            --user-data-dir="$smoke_directory/user-data" >"$app_log" 2>&1 &
          app_pid=$!

          ready=false
          for attempt in {1..80}; do
            if curl --fail --silent "http://127.0.0.1:$smoke_port/" >"$response_file"; then
              ready=true
              break
            fi
            sleep 0.25
          done

          if [[ "$ready" != true ]]; then
            sed -n '1,200p' "$app_log" >&2
            exit 1
          fi
          grep -q '<div id="svelte">' "$response_file"
