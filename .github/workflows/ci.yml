on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build
        run: pnpm build
      - name: Prepare Electron
        run: node -e 'console.log(require("electron"))'
      - name: Record environment
        run: |
          {
            echo "### CI environment"
            echo "- Tested commit: $GITHUB_SHA"
            echo "- Source commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "- Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Image: $ImageOS / $ImageVersion"
            echo "- Node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- pnpm cache hit: ${{ steps.node.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: |
          sysctl hw.logicalcpu hw.memsize machdep.cpu.brand_string
          top -l 0 -s 5 -n 0 > "$RUNNER_TEMP/worker-resources.log" &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true; mkdir -p test-results; cp "$RUNNER_TEMP/worker-resources.log" test-results/resources.log' EXIT
          pnpm exec playwright test --workers=${{ matrix.workers }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.workers }}-workers-attempt-${{ github.run_attempt }}
          path: |
            test-results/results.json
            test-results/resources.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-failure-${{ matrix.workers }}-workers-attempt-${{ github.run_attempt }}
          path: test-results/
